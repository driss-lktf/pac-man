[flake8]
max-line-length = 79
extend-ignore = W503,W504
exclude =
    .git,
    __pycache__,
    mazegenerator,
    build,
    dist,
    .mypy_cache,
    .venv

[mypy]
python_version = 3.10
exclude = (?x)(^mazegenerator/|^build/|^dist/)

[mypy-mazegenerator.*]
follow_imports = skip
ignore_errors = True
ignore_missing_imports = True
